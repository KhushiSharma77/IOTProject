<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<nav class="bg-blue-600 text-white p-4 flex justify-between">
  <h1 class="text-2xl font-bold">
    SISTec IoT Application 2026
  </h1>

  <h2 id="username"></h2>
</nav>

<div class="p-6">

  <!-- SECTION 1 -->

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <div class="bg-white p-6 rounded shadow">

      <h2 class="text-2xl font-bold mb-4">
        Temperature
      </h2>

      <h1 id="temp" class="text-6xl font-bold text-red-500">
        --
      </h1>

      <p id="tempTime"></p>

    </div>

    <div class="bg-white p-6 rounded shadow">

      <h2 class="text-2xl font-bold mb-4">
        Humidity
      </h2>

      <h1 id="hum" class="text-6xl font-bold text-blue-500">
        --
      </h1>

      <p id="humTime"></p>

    </div>

  </div>

  <!-- SECTION 2 -->

  <div class="bg-white p-6 rounded shadow mt-8">

    <h2 class="text-2xl font-bold mb-4">
      LCD Text
    </h2>

    <input
      type="text"
      id="lcdText"
      maxlength="16"
      placeholder="Enter Text"
      class="border w-full p-3 mb-4"
    >

    <button
      onclick="saveLCDText()"
      class="bg-green-500 text-white px-6 py-3"
    >
      Submit
    </button>

  </div>

  <!-- SECTION 3 -->

  <div class="bg-white p-6 rounded shadow mt-8">

    <h2 class="text-2xl font-bold mb-4">
      Sensor Records
    </h2>

    <table class="w-full border">

      <thead>
        <tr class="bg-gray-200">
          <th class="border p-2">#</th>
          <th class="border p-2">Temperature</th>
          <th class="border p-2">Humidity</th>
          <th class="border p-2">Time</th>
          <th class="border p-2">Date</th>
          <th class="border p-2">Action</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

</div>

<script>

document.getElementById("username").innerHTML =
  localStorage.getItem("username");

async function loadLatest() {

  const res = await fetch("/latest-data");

  const data = await res.json();

  if(data) {

    document.getElementById("temp").innerHTML =
      data.temperature + " °C";

    document.getElementById("hum").innerHTML =
      data.humidity + " %";

    document.getElementById("tempTime").innerHTML =
      data.time + " | " + data.date;

    document.getElementById("humTime").innerHTML =
      data.time + " | " + data.date;
  }
}

async function saveLCDText() {

  const text = document.getElementById("lcdText").value;

  const res = await fetch("/save-lcd-text", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      text
    })
  });

  const data = await res.text();

  alert(data);
}

async function loadRecords() {

  const res = await fetch("/all-records");

  const data = await res.json();

  let output = "";

  data.forEach((item, index) => {

    output += `
      <tr>
        <td class="border p-2">${index + 1}</td>
        <td class="border p-2">${item.temperature} °C</td>
        <td class="border p-2">${item.humidity} %</td>
        <td class="border p-2">${item.time}</td>
        <td class="border p-2">${item.date}</td>
        <td class="border p-2">
          <button
            onclick="deleteRecord(${item.id})"
            class="bg-red-500 text-white px-3 py-1"
          >
            Delete
          </button>
        </td>
      </tr>
    `;
  });

  document.getElementById("tableBody").innerHTML = output;
}

async function deleteRecord(id) {

  await fetch("/delete-record/" + id, {
    method: "DELETE"
  });

  loadRecords();
}

loadLatest();
loadRecords();

</script>

</body>
</html>
