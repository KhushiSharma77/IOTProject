<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>

    body{
      font-family:'Space Grotesk',sans-serif;
      overflow:hidden;
      background:#050816;
    }

    .orbitron{
      font-family:'Orbitron',sans-serif;
    }

    .grid-bg{
      background-image:
      linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
      background-size:60px 60px;
    }

    .glass{
      background:rgba(11,16,32,0.6);
      backdrop-filter:blur(18px);
      border:1px solid rgba(16,185,129,0.18);
      box-shadow:
      0 0 40px rgba(16,185,129,0.10),
      inset 0 0 30px rgba(255,255,255,0.03);
    }

    .scanlines::before{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(
        transparent 0%,
        rgba(255,255,255,0.03) 50%,
        transparent 100%
      );
      background-size:100% 8px;
      animation:scan 8s linear infinite;
      pointer-events:none;
    }

    @keyframes scan{
      from{transform:translateY(-100%);}
      to{transform:translateY(100%);}
    }

    .pulse-glow{
      animation:pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow{
      from{
        box-shadow:0 0 10px rgba(16,185,129,0.2);
      }
      to{
        box-shadow:
        0 0 25px rgba(16,185,129,0.6),
        0 0 45px rgba(34,211,238,0.25);
      }
    }

    .floating{
      animation:float 7s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    .input-style{
      background:rgba(6,182,212,0.04);
      border:1px solid rgba(16,185,129,0.15);
      transition:all 0.3s ease;
    }

    .input-style:focus{
      border-color:rgba(16,185,129,0.7);
      box-shadow:
      0 0 15px rgba(16,185,129,0.2);
    }

  </style>
</head>

<body class="grid-bg relative min-h-screen text-white">

  <!-- Ambient Glow Layers -->

  <div class="absolute top-[-200px] left-[-100px] w-[500px] h-[500px] rounded-full bg-emerald-500/10 blur-3xl"></div>

  <div class="absolute bottom-[-200px] right-[-100px] w-[500px] h-[500px] rounded-full bg-cyan-500/10 blur-3xl"></div>

  <div class="absolute inset-0 scanlines"></div>

  <div class="relative z-10 flex items-center justify-center min-h-screen px-6">

    <div class="glass floating pulse-glow relative w-full max-w-md rounded-3xl p-10 overflow-hidden">

      <!-- HUD Corners -->

      <div class="absolute top-3 left-3 w-10 h-10 border-l-2 border-t-2 border-emerald-400"></div>

      <div class="absolute top-3 right-3 w-10 h-10 border-r-2 border-t-2 border-emerald-400"></div>

      <div class="absolute bottom-3 left-3 w-10 h-10 border-l-2 border-b-2 border-emerald-400"></div>

      <div class="absolute bottom-3 right-3 w-10 h-10 border-r-2 border-b-2 border-emerald-400"></div>

      <!-- Header -->

      <div class="mb-8">

        <p class="text-emerald-400 text-sm tracking-[0.4em] uppercase">
          Environmental Access Registry
        </p>

        <h1 class="orbitron text-4xl font-bold mt-3">
          REGISTER
        </h1>

        <div class="mt-4 flex gap-2 items-center">

          <div class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></div>

          <div class="text-xs tracking-widest text-emerald-300">
            USER INITIALIZATION READY
          </div>

        </div>

      </div>

      <!-- Form -->

      <div class="space-y-5">

        <input
          type="text"
          id="name"
          placeholder="FULL NAME"
          class="input-style text-white w-full p-4 rounded-xl outline-none"
        >

        <input
          type="email"
          id="email"
          placeholder="EMAIL ADDRESS"
          class="input-style text-white w-full p-4 rounded-xl outline-none"
        >

        <input
          type="password"
          id="password"
          placeholder="PASSWORD"
          class="input-style text-white w-full p-4 rounded-xl outline-none"
        >

        <button
          onclick="registerUser()"
          class="group relative overflow-hidden bg-emerald-500/15 border border-emerald-400/40 text-emerald-200 w-full p-4 rounded-xl font-semibold tracking-[0.3em] hover:bg-emerald-400/20 transition-all duration-300"
        >

          <span class="relative z-10">
            INITIALIZE USER
          </span>

          <div class="absolute inset-0 bg-gradient-to-r from-transparent via-emerald-300/20 to-transparent -translate-x-full group-hover:translate-x-full transition duration-1000"></div>

        </button>

        <p class="text-center text-emerald-100/70 text-sm pt-2">
          Already registered?

          <a href="/index.html" class="text-emerald-400 hover:text-emerald-200 transition">
            Login Here
          </a>
        </p>

      </div>

    </div>

  </div>

<script>

async function registerUser() {

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/register", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name,
      email,
      password
    })
  });

  const data = await res.text();

  alert(data);

  window.location.href = "/index.html";
}

</script>

</body>
</html>
