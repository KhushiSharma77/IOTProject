<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atmos Login</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body{
      font-family:'Space Grotesk',sans-serif;
      overflow:hidden;
      background:#050816;
    }

    .orbitron{
      font-family:'Orbitron',sans-serif;
    }

    .grid-bg{
      background-image:
      linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
      background-size:60px 60px;
    }

    .glass{
      background:rgba(11,16,32,0.6);
      backdrop-filter:blur(18px);
      border:1px solid rgba(0,255,255,0.15);
      box-shadow:
      0 0 40px rgba(0,255,255,0.08),
      inset 0 0 30px rgba(255,255,255,0.03);
    }

    .scanlines::before{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(
        transparent 0%,
        rgba(255,255,255,0.03) 50%,
        transparent 100%
      );
      background-size:100% 8px;
      animation:scan 8s linear infinite;
      pointer-events:none;
    }

    @keyframes scan{
      from{transform:translateY(-100%);}
      to{transform:translateY(100%);}
    }

    .pulse-glow{
      animation:pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow{
      from{
        box-shadow:0 0 10px rgba(0,255,255,0.2);
      }
      to{
        box-shadow:
        0 0 25px rgba(0,255,255,0.6),
        0 0 45px rgba(168,85,247,0.3);
      }
    }

    .floating{
      animation:float 7s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{transform:translateY(0px);}
      50%{transform:translateY(-10px);}
    }
  </style>
</head>

<body class="grid-bg relative min-h-screen text-white">

  <!-- Ambient Orbs -->
  <div class="absolute top-[-200px] left-[-100px] w-[500px] h-[500px] rounded-full bg-cyan-500/10 blur-3xl"></div>
  <div class="absolute bottom-[-200px] right-[-100px] w-[500px] h-[500px] rounded-full bg-fuchsia-500/10 blur-3xl"></div>

  <div class="absolute inset-0 scanlines"></div>

  <div class="relative z-10 flex items-center justify-center min-h-screen px-6">

    <div class="glass floating pulse-glow relative w-full max-w-md rounded-3xl p-10 overflow-hidden">

      <!-- HUD Corners -->
      <div class="absolute top-3 left-3 w-10 h-10 border-l-2 border-t-2 border-cyan-400"></div>
      <div class="absolute top-3 right-3 w-10 h-10 border-r-2 border-t-2 border-cyan-400"></div>
      <div class="absolute bottom-3 left-3 w-10 h-10 border-l-2 border-b-2 border-cyan-400"></div>
      <div class="absolute bottom-3 right-3 w-10 h-10 border-r-2 border-b-2 border-cyan-400"></div>

      <div class="mb-8">
        <p class="text-cyan-400 text-sm tracking-[0.4em] uppercase">
          Atmospheric Intelligence System
        </p>

        <h1 class="orbitron text-4xl font-bold mt-3">
          LOGIN
        </h1>

        <div class="mt-4 flex gap-2">
          <div class="w-2 h-2 bg-cyan-400 rounded-full animate-ping"></div>
          <div class="text-xs tracking-widest text-cyan-300">
            SECURE TELEMETRY LINK ACTIVE
          </div>
        </div>
      </div>

      <div class="space-y-5">

        <input
          type="email"
          id="email"
          placeholder="EMAIL ADDRESS"
          class="border border-cyan-400/20 bg-cyan-400/5 text-white w-full p-4 rounded-xl outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition"
        >

        <input
          type="password"
          id="password"
          placeholder="PASSWORD"
          class="border border-cyan-400/20 bg-cyan-400/5 text-white w-full p-4 rounded-xl outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition"
        >

        <button
          onclick="login()"
          class="group relative overflow-hidden bg-cyan-500/20 border border-cyan-400/40 text-cyan-200 w-full p-4 rounded-xl font-semibold tracking-[0.3em] hover:bg-cyan-400/20 transition-all duration-300"
        >
          <span class="relative z-10">ACCESS SYSTEM</span>

          <div class="absolute inset-0 bg-gradient-to-r from-transparent via-cyan-300/20 to-transparent -translate-x-full group-hover:translate-x-full transition duration-1000"></div>
        </button>

        <p class="text-center text-cyan-100/70 text-sm pt-2">
          Need clearance?
          <a href="/register.html" class="text-cyan-400 hover:text-cyan-200">
            Register Here
          </a>
        </p>

      </div>
    </div>
  </div>

<script>

async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email,
      password
    })
  });

  const data = await res.json();

  if(data.success) {

    localStorage.setItem("username", data.name);

    window.location.href = "/dashboard.html";

  } else {

    alert("Login Failed");

  }
}

</script>

</body>
</html>
